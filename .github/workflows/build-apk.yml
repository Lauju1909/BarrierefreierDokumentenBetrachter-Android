name: Build Android APK & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Package APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Message for Skip
        id: check_skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE "\[skip ci\]|chore\(release\):"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Auto-Bump Android Version in All Files
        id: bump
        if: github.ref == 'refs/heads/main' && steps.check_skip.outputs.skip == 'false'
        run: |
          CURRENT_CODE=$(grep "versionCode" android/app/build.gradle | head -1 | tr -dc '0-9')
          CURRENT_NAME=$(grep "versionName" android/app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
          NEW_PATCH=$((PATCH + 1))
          NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "Bumping versionCode $CURRENT_CODE -> $NEW_CODE"
          echo "Bumping versionName $CURRENT_NAME -> $NEW_NAME"
          
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" android/app/build.gradle
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" android/app/build.gradle
          
          if [ -f package.json ]; then
            jq --arg ver "$NEW_NAME" '.version = $ver' package.json > package.tmp.json && mv package.tmp.json package.json
          fi

          if [ -f www/app.js ]; then
            sed -i "s/const APP_VERSION = 'v[0-9.]*';/const APP_VERSION = 'v$NEW_NAME';/g" www/app.js
          fi

          if [ -f www/index.html ]; then
            sed -i -E "s/(id=\"app-version-display\">v?)[0-9]+\.[0-9]+\.[0-9]+/\1$NEW_NAME/g" www/index.html
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          [ -f package.json ] && git add package.json
          [ -f www/app.js ] && git add www/app.js
          [ -f www/index.html ] && git add www/index.html
          git commit -m "chore(release): auto-bump version to v$NEW_NAME [skip ci]"
          git tag "v$NEW_NAME"
          git push origin main
          git push origin "v$NEW_NAME"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APKs with Gradle
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Get Target Tag
        id: target_tag
        run: |
          TAG=$(grep "versionName" android/app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          echo "tag=v$TAG" >> $GITHUB_OUTPUT

      - name: Generate Changelog from Commits
        id: changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ steps.target_tag.outputs.tag }}"
          CODE=$(grep "versionCode" android/app/build.gradle | head -1 | tr -dc '0-9')
          echo "## 📝 Änderungsprotokoll für $TAG (Build-Code $CODE)" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📱 Was hat sich geändert:" >> release_notes.md
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges 2>/dev/null | grep -vE "chore\(release\)|chore\(ci\)|\[skip ci\]" || true)
          else
            COMMITS=$(git log -n 5 --pretty=format:"- %s" --no-merges 2>/dev/null | grep -vE "chore\(release\)|chore\(ci\)|\[skip ci\]" || true)
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="- Allgemeine Verbesserungen, TalkBack-Optimierungen und Dokumenten-Parser-Updates"
          fi
          
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "✨ *Vollautomatisch gebaut und signiert über GitHub Actions beim Push auf \`main\`.*" >> release_notes.md

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target_tag.outputs.tag }}
          name: "Barrierefreier Dokumenten-Betrachter ${{ steps.target_tag.outputs.tag }}"
          body_path: release_notes.md
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Custom F-Droid Repo Update
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          gh workflow run update-repo.yml --repo Lauju1909/fdroid-repo || true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TRIGGER }}
